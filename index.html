
<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-title" content="Calix Mojica">
    <meta name="application-name" content="Calix Mojica">

    <title>Calix Mojica</title>

    <meta
        name="description"
        content="Calix Mojica is a real estate professional and the director of Dream Property. Bachelor of Property graduate from the University of Auckland with extensive experience in the real estate management industry."
    >

    <meta name="author" content="Calix Mojica">
    <meta name="robots" content="index, follow">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:title" content="Calix Mojica">

    <meta
        property="og:description"
        content="Calix Mojica is a real estate professional and the director of Dream Property."
    >

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calixmojica.com/">
    <meta property="og:image" content="https://calixmojica.com/headshot.jpg">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Calix Mojica",
        "url": "https://calixmojica.com/",
        "jobTitle": "Property Professional",
        "description": "Calix Mojica is a trusted property professional helping clients buy, sell, rent, and invest with confidence. Bachelor of Property graduate from the University of Auckland with extensive experience in property management and residential leasing."
    }
    </script>

    <style>

        :root {

            --background: #09090b;

            --text: #f5f5f7;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            background: var(--background);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

        }


        button,
        input,
        textarea,
        select {

            font-family: inherit;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        .container {

            width: min(92%, 620px);

            margin: 0 auto;

        }


        header {

            text-align: center;

            padding: 55px 0 28px;

        }


        .headshot {

            width: 118px;

            height: 118px;

            display: block;

            margin: 0 auto 22px;

            border-radius: 50%;

            object-fit: cover;

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.45);

        }


        h1 {

            font-size: clamp(32px, 8vw, 42px);

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: -1.5px;

        }


        .socials {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 25px;

            margin-top: 23px;

        }


        .social-link {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            opacity: 0.88;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;

        }


        .social-link:hover {

            opacity: 1;

            transform: translateY(-2px);

        }


        .social-link svg {

            width: 25px;

            height: 25px;

            fill: currentColor;

        }


        footer {

            margin-top: auto;

            padding: 35px 0 45px;

            color: #5f5f64;

            font-size: 12px;

            text-align: center;

        }


        @media (max-width: 480px) {

            header {

                padding-top: 42px;

            }


            .headshot {

                width: 105px;

                height: 105px;

            }

        }

    </style>

</head>


<body>

    <main class="container">

        <header>

            <img
                class="headshot"
                src="headshot.jpg"
                alt="Calix Mojica"
            >

            <h1>
                Calix Mojica
            </h1>

            <div class="socials">

                <a
                    class="social-link"
                    href="https://instagram.com/calixmojicarealestate"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.9"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="4.2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.9"
                        />

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1.2"
                        />

                    </svg>

                </a>


                <a
                    class="social-link"
                    href="https://www.tiktok.com/@calixmojicarealestate"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="TikTok"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M15.2 3c.3 2.5 1.7 4.2 4.2 4.4v3.1c-1.7-.1-3.1-.6-4.2-1.5v6.5c0 3.7-2.4 5.7-5.6 5.7-3 0-5.6-2.1-5.6-5.2 0-3.4 2.8-5.4 6.1-5.1v3.2c-1.7-.3-3 .5-3 1.9 0 1.2 1 2.1 2.3 2.1 1.5 0 2.6-.9 2.6-2.9V3h3.2z"
                        />

                    </svg>

                </a>


                <a
                    class="social-link"
                    href="https://www.youtube.com/@CalixMojicaRealEstate"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="YouTube"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M21.6 7.2a2.9 2.9 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.6.5a2.9 2.9 0 0 0-2 2C2 9 2 12 2 12s0 3 .4 4.8a2.9 2.9 0 0 0 2 2c1.8.5 7.6.5 7.6.5s5.8 0 7.6-.5a2.9 2.9 0 0 0 2-2c.4-1.8.4-4.8.4-4.8s0-3-.4-4.8z"
                        />

                        <path
                            d="m10 15.5 5-3.5-5-3.5v7z"
                            fill="#09090b"
                        />

                    </svg>

                </a>

            </div>

        </header>

    </main>


    <footer>

        © 2026 Calix Mojica

    </footer>

</body>

</html>
